name: Build OpenWrt v25.12.2 for M4 Mac

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_TAG: v25.12.2  # 明确锁定目标版本
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

    - name: Clone Source & Checkout Tag
      run: |
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout $REPO_TAG
        # 重点：不要再向 feeds.conf.default 里追加任何 psw2 的内容！保持官方源干净。

    - name: Update & Install Official Feeds
      run: |
        cd openwrt
        # 只更新官方包，不掺杂第三方
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Manually Add PassWall Source (Bypass Feeds)
      run: |
        cd openwrt
        # 1. 直接将 PassWall 的两个仓库克隆到 package 目录下 (深度为1，极速克隆)
        git clone --depth 1 -b main https://github.com/xiaorouji/openwrt-passwall.git package/passwall
        git clone --depth 1 -b main https://github.com/xiaorouji/openwrt-passwall-packages.git package/passwall-packages

        # 2. 清除官方 feeds 中可能冲突的旧版本核心 (防止编译时发生版本冲突报错)
        rm -rf feeds/packages/net/xray-core
        rm -rf feeds/packages/net/sing-box


    - name: Build
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_v25.12.2_M4
        path: openwrt/bin/targets/armvirt/generic/*.qcow2
