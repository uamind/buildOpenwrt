name: Build OpenWrt v25.12.2 for M4 Mac

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_TAG: v25.12.2  # 明确锁定目标版本
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

    - name: Clone Source & Checkout Tag
      run: |
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout $REPO_TAG
        # 重点：不要再向 feeds.conf.default 里追加任何 psw2 的内容！保持官方源干净。

    - name: Update & Install Official Feeds
      run: |
        cd openwrt
        # 只更新官方包，不掺杂第三方
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Manually Add Custom Sources (Bypass Feeds)
      run: |
        cd openwrt
        mkdir -p package/custom_apps
        cd package/custom_apps

        # 2. UI 增强：Argon 主题及其控制面板
        git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git
        git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git

        # 3. 核心市场：iStore (linkease 官方源)
        git clone --depth 1 https://github.com/linkease/istore.git

        cd ../../

        # 4. 清理可能冲突的旧组件
        rm -rf feeds/packages/net/xray-core
        rm -rf feeds/packages/net/sing-box
        rm -rf feeds/luci/themes/luci-theme-argon  # 删除官方旧版 argon 避免版本冲突

    - name: Configure & Permanent TUNA Mirror
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        cd openwrt


        # 将 Argon 设为系统默认主题！
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile

        make defconfig

    - name: Build
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_v25.12.2_M4
        path: openwrt/bin/targets/armvirt/generic/*.qcow2
